[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playup-backend"
version = "0.1.0"
description = "PlayUp backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "testcontainers[postgres]>=4.8,<5",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

# `migrations` sits beside `app` but is not importable as a package, so
# point setuptools at the one package this project ships.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# tests/ is a plain directory that imports `tests.factories`, so the project
# root must be importable when pytest is invoked bare (not via `python -m`).
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: needs a real PostgreSQL instance"]

[tool.mypy]
python_version = "3.12"
strict = true