# Serves the built SPA and proxies /api/* to the backend container.
# The /api prefix is stripped, matching the Vite dev proxy in vite.config.ts,
# so the frontend calls the same paths in development and production.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolve the backend lazily through Docker's embedded DNS, so nginx still
    # starts (and recovers) when the backend container is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite fingerprints everything under assets/, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
